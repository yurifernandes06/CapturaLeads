name: SLA cron

# Agendador gratuito para o SLA em hospedagem serverless (ex.: Vercel Hobby).
# Configure os secrets APP_URL e CRON_SECRET no repositório para ativar.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chama /api/cron/sla
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL/CRON_SECRET não configurados; pulando."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/sla"
